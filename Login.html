<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Login | A Quality Pool Company</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 50%, #38bdf8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="white" stroke-width="1" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
            animation: slideBackground 20s linear infinite;
        }

        @keyframes slideBackground {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        /* Floating Pool Elements */
        .float-element {
            position: fixed;
            font-size: 40px;
            opacity: 0.15;
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
        }

        .float-element:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .float-element:nth-child(2) { top: 70%; right: 15%; animation-delay: 3s; }
        .float-element:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 6s; }
        .float-element:nth-child(4) { top: 30%; right: 25%; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(-40px) rotate(-5deg); }
            75% { transform: translateY(-20px) rotate(3deg); }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            background: white;
            border-radius: 24px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
            padding: 50px 40px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-section h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }

        .logo-section p {
            font-size: 15px;
            color: #6b7280;
        }

        /* Form Styles */
        .login-form {
            margin-top: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            font-family: 'Barlow', sans-serif;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .form-input:focus {
            outline: none;
            border-color: #0284c7;
            background: white;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        .form-input:focus + .input-icon {
            color: #0284c7;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0284c7;
        }

        .remember-me label {
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
        }

        .forgot-password {
            font-size: 14px;
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #0369a1;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
            color: white;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            margin-bottom: 24px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button i {
            margin-right: 8px;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            background: white;
            padding: 0 16px;
            position: relative;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
        }

        .quick-access {
            text-align: center;
        }

        .quick-access-text {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .quick-button {
            display: inline-block;
            padding: 10px 20px;
            background: #f3f4f6;
            color: #374151;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .quick-button:hover {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        .quick-button i {
            margin-right: 6px;
        }

        /* Error Message */
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Loading State */
        .login-button.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .login-button.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
            }

            .logo-section h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Elements -->
    <div class="float-element">🏊‍♂️</div>
    <div class="float-element">🦩</div>
    <div class="float-element">🏖️</div>
    <div class="float-element">🌊</div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">
                <img src="https://cdn.prod.website-files.com/6931dc4e8e97334e195432df/6931dca5c5fb5c5fc0860f2c_test.png" alt="A Quality Pool Company Logo" style="width: 100%; height: 100%; object-fit: contain; padding: 8px;">
            </div>
            <h1>Team Login</h1>
            <p>A Quality Pool Company</p>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> Invalid email or password
        </div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" class="form-input" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="login-button">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = form.querySelector('.login-button');

        // Login credentials
        const VALID_EMAIL = 'brookspumpingpoolco@gmail.com';
        const VALID_PASSWORD = 'poolco';

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loading state
            loginButton.classList.add('loading');
            errorMessage.classList.remove('show');
            
            // Get form values
            const email = form.querySelector('input[type="email"]').value.trim();
            const password = form.querySelector('input[type="password"]').value;
            
            // Simulate loading delay
            setTimeout(() => {
                // Check credentials
                if (email === VALID_EMAIL && password === VALID_PASSWORD) {
                    // Successful login - redirect to dashboard
                    window.location.href = 'Dashboard.html';
                } else {
                    // Invalid credentials - show error
                    loginButton.classList.remove('loading');
                    errorMessage.classList.add('show');
                }
            }, 800);
        });

        // Hide error on input
        form.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', () => {
                errorMessage.classList.remove('show');
            });
        });
    </script>
</body>
</html>
