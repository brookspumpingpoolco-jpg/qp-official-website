<!-- 
  Customer Portal - Webflow Embed Code
  =====================================
  
  This code can be embedded in Webflow using the "Embed" element.
  The Customer Portal is hosted in Google Apps Script and will load in an iframe.
  
  INSTRUCTIONS:
  1. In Webflow, add an "Embed" element to your page
  2. Paste this entire code block into the embed element
  3. The Customer Portal will load in a responsive iframe
-->

<div style="width: 100%; height: 100vh; min-height: 800px; position: relative; overflow: hidden;">
  <iframe 
    id="customerPortalFrame"
    src="https://script.google.com/macros/s/AKfycbyniiZIKYstT0-UROurdf8cj-rx8KraX7aZpk6oEjxTfaFjEjAZ8QaRgj2Tg1Qh-l3S/exec"
    style="
      width: 100%;
      height: 100%;
      min-height: 800px;
      border: none;
      display: block;
      background: transparent;
    "
    title="Customer Portal - A Quality Pool Company"
    allow="fullscreen"
    loading="lazy"
  ></iframe>
</div>

<script>
  // Optional: Handle iframe resize for better responsiveness
  window.addEventListener('message', function(event) {
    // Listen for messages from the iframe if needed
    if (event.data && event.data.type === 'resize') {
      const iframe = document.getElementById('customerPortalFrame');
      if (iframe && event.data.height) {
        iframe.style.height = event.data.height + 'px';
      }
    }
  });
  
  // Optional: Handle iframe load errors
  document.getElementById('customerPortalFrame').addEventListener('load', function() {
    console.log('Customer Portal loaded successfully');
  });
  
  document.getElementById('customerPortalFrame').addEventListener('error', function() {
    console.error('Error loading Customer Portal');
    // You could show an error message here if needed
  });
</script>
