<!-- 
Google Sites Embed Code - GitHub Hosted Login
==============================================

INSTRUCTIONS:
1. First, upload RentalLogin.html to your GitHub repo
2. Get the raw GitHub URL (like: https://raw.githubusercontent.com/brookspumpingpoolco-jpg/RENT/BRANCH/RentalLogin.html)
3. In Google Sites, go to your login page
4. Click "Insert" → "Embed" → "Embed code"
5. Paste the iframe code below (replace YOUR_GITHUB_RAW_URL)
6. Click "Save"

IFRAME CODE (replace YOUR_GITHUB_RAW_URL):
-->

<iframe 
    src="YOUR_GITHUB_RAW_URL_HERE" 
    width="100%" 
    height="700" 
    frameborder="0"
    scrolling="no"
    style="border: none; width: 100%; min-height: 600px; border-radius: 12px;">
</iframe>
