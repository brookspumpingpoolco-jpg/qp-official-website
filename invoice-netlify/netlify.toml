# =============================================================================
# Canonical Netlify config for the A Quality Pool Company invoice site
# Production: aesthetic-kataifi-88ba27 (https://aesthetic-kataifi-88ba27.netlify.app)
# =============================================================================
#
# Single source of truth. This file is the only place that defines publish
# directory, functions, redirects, and headers for the invoice stack.
#
# Deploy (CLI or Git must use this folder as the site root):
#   CLI:  cd invoice-netlify && netlify deploy --prod
#   Git:  Netlify UI → Site settings → Build & deploy → Base directory = invoice-netlify
#
# The repo-root netlify.toml only sets [build] base = "invoice-netlify" so a
# Git-connected deploy from the repo root still lands here. It has no redirects
# of its own — competing [[redirects]] caused production to pick InvoiceEstimateUI
# vs Login_Embed depending on whether the deploy used the root or this folder.
#
# GAS_* URLs and STRIPE_SECRET_KEY live in the Netlify UI (env vars). Do not
# put secrets in this file. Login_Embed talks to gas-proxy?t=auth (GAS_AUTH_URL).
# =============================================================================

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Auth gate first. Invoice UI, dashboard, and weekly service have explicit paths.
[[redirects]]
  from = "/"
  to = "/Login_Embed.html"
  status = 200

[[redirects]]
  from = "/invoice"
  to = "/InvoiceEstimateUI.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/Dashboard_Embed.html"
  status = 200

[[redirects]]
  from = "/weekly"
  to = "/WeeklyService.html"
  status = 200

[[redirects]]
  from = "/weekly-service"
  to = "/WeeklyService.html"
  status = 200

# frame-ancestors (not X-Frame-Options) so the marketing site can iframe login
# and dashboard embeds. SAMEORIGIN on /* blocked aqualitypoolcompanyusa.com.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://aqualitypoolcompanyusa.com https://www.aqualitypoolcompanyusa.com"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
