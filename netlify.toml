# Pointer only — do not add [[redirects]], [functions], or publish here.
#
# The invoice site (aesthetic-kataifi-88ba27) is configured from
# invoice-netlify/netlify.toml. Setting base here makes a Git-connected
# deploy from the repo root use that folder so CLI (`cd invoice-netlify &&
# netlify deploy --prod`) and Git deploys cannot pick different redirects
# or a different gas-proxy.
#
# Preferred Netlify UI setting (matches CLI): Base directory = invoice-netlify
# See invoice-netlify/DEPLOY.md

[build]
  base = "invoice-netlify"
